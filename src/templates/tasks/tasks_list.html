{% extends "base.html" %}

{% block content %}

<style>
.table-emerald thead {
    background-color: #10b981;
    color: white;
}

.table-emerald tbody tr:hover {
    background-color: #d1fae5;
}

.table-emerald td,
.table-emerald th {
    transition: background-color 0.2s;
}
</style>

<div class="container mt-4" style="max-width: 1000px;">

<table class="table table-bordered table-striped text-center table-emerald">
  <thead>
      <th scope="col">#</th>
      <th scope="col">Task Name</th>
      <th scope="col">Status</th>
      <th scope="col">Priority</th>
      <th scope="col">Description</th>
      </thead>

  <tbody>
  {% for task in tasks %}
      <tr>
          <td>{{ forloop.counter }}</td>
          <td>{{ task.task_name }}</td>
          <td>{{ task.status }}</td>
          <td>{{ task.priority }}</td>
          <td></td>
      </tr>
  {% endfor %}
  </tbody>

</div>

{% endblock %}
