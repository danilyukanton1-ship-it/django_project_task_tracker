{% extends "tasks/base.html" %}
{% load crispy_forms_tags %}

{% block content %}

<p>Форма создания вложения</p>

{% if messages %}
    {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    {% endfor %}
{% endif %}

<form method="post" action="{% url 'create_attachment' %}" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary">Создать вложение</button>
</form>

{% endblock %}
